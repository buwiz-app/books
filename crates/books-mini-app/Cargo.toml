[package]
name = "books-mini-app"
version = "0.1.0"
description = "Buwiz Books mini app for the Buwiz Bot: the stdio MCP server for plugin app.buwiz.books"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "books-mini-app"
path = "src/main.rs"

