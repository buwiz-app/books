[dependencies]
buwiz-plugin = { workspace = true }
books-core = { path = "../books-core" }
books-store = { path = "../books-store" }
# Session certificates are signed with the ed25519 key the Bot provisions (protocol 1.0 §5.5).
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# Tickets: 130 bits from the OS CSPRNG (protocol 1.0 §15.4).
getrandom = "0.3"
# Manifest hash, permissions digest and app fingerprints (protocol 1.0 §6.2, §11.2, §12).
sha2 = "0.10"
serde_json = "1"
# A chart, journal or statement picked as an .xlsx or .xls reads as its CSV
# (`sheets.rs`); values only, no number computed here. A report is written as
# an .xlsx with its writer (`report_xlsx.rs`).
office_oxide = { version = "0.1.16", default-features = false }
# Device sign-in to buwiz-cloud and the tax-profile list, over TLS
# (rustls); only when the user signs in or lists tax profiles. A release build
# uses api.buwiz.com unless BOOKS_CLOUD_URL says otherwise (`cloud.rs`).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# A PDF statement's pages are drawn to PNG once, when the document is kept
# (`page_pictures.rs`), so the Books window can show them: pure Rust, no
# native library, the same on Linux, macOS and Windows.
hayro = "0.9"

