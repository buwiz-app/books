[package]
name = "books-store"
version = "0.1.0"
description = "Buwiz Books' encrypted local store: SQLCipher, a 0600 key file, migrations"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
books-core = { path = "../books-core" }
# SQLCipher, built from source with a vendored OpenSSL, as BIR does.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
