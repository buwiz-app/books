[workspace]
resolver = "3"
members = ["crates/books-core", "crates/books-store", "crates/books-mini-app", "crates/books-screens"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Money is integer centavos and signed objects carry integers only: no floats.
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"

[workspace.dependencies]
# The Buwiz SDK, pinned by commit. The member crates inherit these two entries; the doc links in README.md and
# AGENTS.md name the same commit, and tools/check-all.sh fails when they drift
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }

[profile.release]
codegen-units = 1
lto = "thin"
