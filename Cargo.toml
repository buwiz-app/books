[workspace]
resolver = "3"
members = ["crates/books-core", "crates/books-store", "crates/books-mini-app"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Money is integer centavos and signed objects carry integers only: no floats.
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
