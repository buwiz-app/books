[workspace]
resolver = "3"
members = ["crates/books-core", "crates/books-store", "crates/books-mini-app", "crates/books-screens"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Money is integer centavos and signed objects carry integers only: no floats.
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"

[workspace.dependencies]
# The Buwiz SDK, pinned by commit: the one place this repo names the revision
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "8f95537270815e75d0a23488ca12d175138c6d91" }
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "8f95537270815e75d0a23488ca12d175138c6d91" }

[profile.release]
codegen-units = 1
lto = "thin"
